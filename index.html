<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrunko's Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ed-bg:#0f0f14;--ed-card:#181820;--ed-el:#1e1e28;--ed-tx:#e8e6f0;--ed-dm:#5a586e;
  --ed-bd:rgba(124,92,252,.12);--ed-bh:rgba(124,92,252,.3);
  --a-bg:#fdfbf7;--a-tx:#2c2417;--a-sec:#5c5346;--a-hd:#1a1209;
  --a-ac:#8b5e3c;--a-acl:#c8956c;--a-lk:#7c4a2d;--a-bd:#e8dfd4;--a-bl:#f0ebe3;
  --a-cbg:#282c34;--a-bq:#f7f3ed;--a-bqb:#d4c4a8;--a-th:#f5f0e8;
  --a-st:#1a1209;--a-em:#8b5e3c;--a-ic:#f0ebe3;--a-ict:#8b5e3c;
  --a-card:#fff;--a-even:rgba(245,240,232,.5);--a-img-shadow:0 2px 8px rgba(0,0,0,.08);
  --ac1:#7c5cfc;--ac2:#c084fc;--g1:linear-gradient(135deg,#7c5cfc,#c084fc 50%,#60a5fa);
  --r:16px;--rs:10px;--rx:6px;
  --fb:'Inter',-apple-system,sans-serif;--fa:'Merriweather',Georgia,serif;--fm:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --ed-bg:#0f0f14;--ed-card:#181820;--ed-el:#1e1e28;--ed-tx:#e8e6f0;--ed-dm:#5a586e;
  --ed-bd:rgba(124,92,252,.12);--ed-bh:rgba(124,92,252,.3);
  --a-bg:#121218;--a-tx:#d4d2de;--a-sec:#8b89a0;--a-hd:#f0eef8;
  --a-ac:#b48cff;--a-acl:#c084fc;--a-lk:#a78bfa;--a-bd:#2a2a38;--a-bl:#1e1e2c;
  --a-cbg:#1a1a24;--a-bq:#1a1a24;--a-bqb:#7c5cfc;--a-th:#1a1a24;
  --a-st:#f0eef8;--a-em:#c084fc;--a-ic:#1a1a24;--a-ict:#b48cff;
  --a-card:#181820;--a-even:rgba(255,255,255,.03);--a-img-shadow:0 2px 8px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --ed-bg:#f4f3f8;--ed-card:#fff;--ed-el:#eee9f5;--ed-tx:#1e1a2e;--ed-dm:#7a7590;
  --ed-bd:rgba(124,92,252,.15);--ed-bh:rgba(124,92,252,.35);
  --a-bg:#fdfbf7;--a-tx:#2c2417;--a-sec:#5c5346;--a-hd:#1a1209;
  --a-ac:#8b5e3c;--a-acl:#c8956c;--a-lk:#7c4a2d;--a-bd:#e8dfd4;--a-bl:#f0ebe3;
  --a-cbg:#282c34;--a-bq:#f7f3ed;--a-bqb:#d4c4a8;--a-th:#f5f0e8;
  --a-st:#1a1209;--a-em:#8b5e3c;--a-ic:#f0ebe3;--a-ict:#8b5e3c;
  --a-card:#fff;--a-even:rgba(245,240,232,.5);--a-img-shadow:0 2px 8px rgba(0,0,0,.08);
}
body{font-family:var(--fb);background:var(--ed-bg);color:var(--ed-tx);line-height:1.7;font-size:16px;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 20% 50%,rgba(124,92,252,.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(96,165,250,.05) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(192,132,252,.04) 0%,transparent 50%);animation:bgD 20s ease-in-out alternate;pointer-events:none;z-index:0}
[data-theme="light"] body::before,body:not([data-theme])::before{opacity:.5}
body.reader-on::before{display:none}
@keyframes bgD{0%{transform:translate(0) rotate(0)}100%{transform:translate(-3%,2%) rotate(2deg)}}

.theme-toggle{position:fixed;top:16px;right:16px;z-index:100;width:44px;height:44px;border-radius:50%;border:1px solid var(--ed-bd);background:var(--ed-el);color:var(--ed-tx);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.theme-toggle:hover{background:var(--ed-bh);transform:rotate(30deg)}

#input-screen{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:48px 24px 60px}
.hero{text-align:center;margin-bottom:48px}
.hero-badge{display:inline-block;padding:6px 16px;background:rgba(124,92,252,.12);border:1px solid rgba(124,92,252,.2);border-radius:100px;font-size:12px;font-weight:600;color:var(--ac2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:20px}
.hero h1{font-size:clamp(36px,6vw,56px);font-weight:900;background:var(--g1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin-bottom:16px;letter-spacing:-1px}
.hero p{color:var(--ed-dm);font-size:17px;max-width:520px;margin:0 auto;line-height:1.6}

.editor-wrap{border-radius:var(--r);overflow:hidden;box-shadow:0 0 40px rgba(124,92,252,.1),0 8px 32px rgba(0,0,0,.4);border:1px solid var(--ed-bd);transition:border-color .3s,box-shadow .3s}
.editor-wrap:focus-within{border-color:var(--ed-bh);box-shadow:0 0 60px rgba(124,92,252,.2),0 8px 32px rgba(0,0,0,.4)}
.ed-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--ed-el);border-bottom:1px solid var(--ed-bd)}
.ed-bar .dots{display:flex;gap:6px}
.ed-bar .dot{width:10px;height:10px;border-radius:50%}
.dot:nth-child(1){background:#f43f5e}.dot:nth-child(2){background:#fb923c}.dot:nth-child(3){background:#34d399}
.ed-bar .label{font-size:12px;color:var(--ed-dm);font-weight:500;letter-spacing:.5px}
.ed-bar .cnt{font-size:12px;color:var(--ed-dm);font-family:var(--fm)}
#editor{width:100%;min-height:420px;padding:24px;font-family:var(--fm);font-size:14px;line-height:1.7;background:var(--ed-card);color:var(--ed-tx);border:none;resize:vertical;outline:none;display:block;transition:background .3s,color .3s}
#editor::placeholder{color:var(--ed-dm)}

.bbar{display:flex;align-items:center;justify-content:space-between;margin-top:20px;flex-wrap:wrap;gap:12px}
.btn-go{padding:14px 40px;background:var(--g1);color:#fff;border:none;border-radius:var(--rs);font-size:16px;font-weight:700;cursor:pointer;font-family:var(--fb);letter-spacing:.3px;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 20px rgba(124,92,252,.3)}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(124,92,252,.45)}
.bbar-h{display:flex;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(124,92,252,.06);border:1px solid var(--ed-bd);border-radius:100px;font-size:12px;color:var(--ed-dm)}
.chip kbd{background:var(--ed-bd);padding:2px 6px;border-radius:4px;font-family:var(--fm);font-size:11px;color:var(--ed-tx)}

.smp{margin-top:32px;text-align:center}
.smp-l{font-size:12px;color:var(--ed-dm);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.smp-g{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.smp-b{padding:8px 16px;background:var(--ed-el);border:1px solid var(--ed-bd);border-radius:var(--rx);color:var(--ed-dm);font-size:13px;cursor:pointer;font-family:var(--fb);transition:all .2s}
.smp-b:hover{background:rgba(124,92,252,.1);border-color:var(--ed-bh);color:var(--ed-tx)}

#reading-screen{display:none;position:relative;z-index:1;max-width:820px;margin:0 auto;padding:40px 24px 140px}
body.reader-on{background:var(--a-bg);color:var(--a-tx);transition:background .3s,color .3s}
body.reader-on .theme-toggle{border-color:var(--a-bd);background:var(--a-card);color:var(--a-tx)}
body.reader-on .theme-toggle:hover{background:var(--a-bl)}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px}
.btn-back{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:rgba(139,94,60,.08);border:1px solid rgba(139,94,60,.15);border-radius:var(--rs);color:var(--a-ac);font-size:14px;cursor:pointer;font-family:var(--fb);font-weight:500;transition:all .2s}
.btn-back:hover{background:rgba(139,94,60,.14)}
.rm{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--a-sec)}
.rm .lb{padding:4px 12px;background:rgba(139,94,60,.08);border-radius:100px;font-weight:600;color:var(--a-ac);font-size:11px;text-transform:uppercase;letter-spacing:.5px}

.art{background:var(--a-card);border:1px solid var(--a-bd);border-radius:var(--r);padding:56px 52px;box-shadow:var(--a-img-shadow),0 8px 24px rgba(0,0,0,.06);animation:fadeUp .45s ease-out;transition:background .3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.art h1{font-family:var(--fa);font-size:36px;font-weight:900;line-height:1.25;margin:0 0 32px;color:var(--a-hd);letter-spacing:-.3px}
.art h2{font-family:var(--fa);font-size:26px;font-weight:700;line-height:1.3;margin:52px 0 18px;padding-bottom:14px;border-bottom:2px solid var(--a-bl);color:var(--a-hd)}
.art h2:first-of-type{margin-top:0}
.art h3{font-family:var(--fa);font-size:21px;font-weight:700;line-height:1.4;margin:40px 0 14px;color:var(--a-ac)}
.art h4{font-size:18px;font-weight:700;margin:28px 0 10px;color:var(--a-hd)}
.art p{font-family:var(--fa);font-size:17px;line-height:1.85;margin:0 0 20px;color:var(--a-tx);text-align:justify;hyphens:auto}
.art ul,.art ol{margin:0 0 20px;padding-left:28px}
.art li{font-family:var(--fa);font-size:17px;line-height:1.8;margin-bottom:8px;color:var(--a-tx)}
.art li::marker{color:var(--a-acl)}
.art strong{font-weight:700;color:var(--a-st)}
.art em{font-style:italic;color:var(--a-em)}
.art a{color:var(--a-lk);text-decoration:underline;text-decoration-color:rgba(124,74,45,.25);text-underline-offset:3px;transition:text-decoration-color .2s}
.art a:hover{text-decoration-color:var(--a-lk)}
.art blockquote{margin:28px 0;padding:20px 24px;background:var(--a-bq);border-left:4px solid var(--a-bqb);border-radius:0 var(--rx) var(--rx) 0}
.art blockquote p{font-size:16px;color:var(--a-sec);margin-bottom:0}
.art code{font-family:var(--fm);font-size:14px;background:var(--a-ic);color:var(--a-ict);padding:2px 7px;border-radius:4px}
.art pre{margin:24px 0;border-radius:var(--rs);overflow:hidden;border:1px solid rgba(128,128,128,.15)}
.art pre code{display:block;padding:22px;background:var(--a-cbg)!important;color:#abb2bf;font-size:13px;line-height:1.65;overflow-x:auto}
.art table{width:100%;margin:28px 0;border-collapse:separate;border-spacing:0;border-radius:var(--rs);overflow:hidden;border:1px solid var(--a-bd);font-size:15px}
.art th{padding:14px 18px;text-align:left;background:var(--a-th);font-weight:700;color:var(--a-ac);border-bottom:2px solid var(--a-bd);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.art td{padding:14px 18px;border-bottom:1px solid var(--a-bl);color:var(--a-tx);font-family:var(--fa);font-size:15px;line-height:1.6}
.art tr:last-child td{border-bottom:none}
.art tr:nth-child(even) td{background:var(--a-even)}
.art hr{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--a-bd),transparent);margin:44px 0}
.art img{max-width:100%;border-radius:var(--rs);margin:20px 0;box-shadow:var(--a-img-shadow)}

.art [data-p]{cursor:pointer;border-left:3px solid transparent;padding-left:10px;margin-left:-13px;transition:border-color .15s,background .15s;border-radius:0 4px 4px 0}
.art [data-p]:hover{border-left-color:var(--a-acl);background:rgba(139,94,60,.03)}
.art [data-p].reading{border-left-color:var(--ac1);background:rgba(124,92,252,.05)}

.tts-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,20,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,.06);padding:14px 24px;display:none;align-items:center;justify-content:center;gap:12px;z-index:200;flex-wrap:wrap}
[data-theme="light"] .tts-bar{background:rgba(30,28,42,.95)}
.tts-bar.on{display:flex}
.tts-bar button{padding:10px 22px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#e8e6f0;border-radius:var(--rx);cursor:pointer;font-size:14px;font-weight:600;font-family:var(--fb);transition:all .15s;white-space:nowrap}
.tts-bar button:hover{background:rgba(255,255,255,.12)}
.tts-bar button.pr{background:var(--g1);border:none;color:#fff;padding:10px 28px}
.tts-bar button.pr:hover{box-shadow:0 4px 16px rgba(124,92,252,.4)}
.tts-bar .tc{display:flex;align-items:center;gap:8px;font-size:13px;color:#8b89a0}
.tts-bar select{background:rgba(255,255,255,.08);color:#e8e6f0;border:1px solid rgba(255,255,255,.1);border-radius:var(--rx);padding:8px 12px;font-size:13px;font-family:var(--fb);cursor:pointer;outline:none}
.tts-bar select:focus{border-color:var(--ac1)}
.tts-bar .tp{flex:1;min-width:80px;max-width:200px;height:4px;background:rgba(255,255,255,.08);border-radius:100px;overflow:hidden}
.tts-bar .tpf{height:100%;background:var(--g1);border-radius:100px;width:0%;transition:width .3s}
.tts-bar .ts{font-size:12px;color:#5a586e;min-width:32px;text-align:center;font-family:var(--fm)}
.tts-eng{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:rgba(52,211,153,.15);color:#34d399}
.tts-eng.fb{background:rgba(251,146,60,.15);color:#fb923c}

@media(max-width:900px){
  .tts-bar{gap:6px;padding:10px 10px}
  .tts-bar .tc span{display:none}
  .tts-bar select{max-width:110px;padding:6px 8px;font-size:12px}
}
@media(max-width:768px){
  #input-screen{padding:24px 16px 40px}
  #reading-screen{padding:24px 16px 140px}
  .art{padding:32px 22px}
  .art h1{font-size:28px}.art h2{font-size:22px}.art h3{font-size:19px}
  .art p,.art li{font-size:16px}
  .hero h1{font-size:32px}
  .tts-bar button.pr{padding:8px 16px;font-size:13px}
  .theme-toggle{top:12px;right:12px;width:38px;height:38px;font-size:17px}
}

::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(139,94,60,.15);border-radius:100px}::-webkit-scrollbar-thumb:hover{background:rgba(139,94,60,.3)}
</style>
</head>
<body>

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Темна / Світла тема">☀️</button>

<div id="input-screen">
  <div class="hero">
    <div class="hero-badge">Markdown → Beautiful Page</div>
    <h1>Petrunko's Reader</h1>
    <p>Вставте будь-який текст — отримаєте красиву сторінку з якісною озвучкою. Клікніть на абзац щоб читати з нього.</p>
  </div>
  <div class="editor-wrap">
    <div class="ed-bar">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <span class="label">MARKDOWN</span>
      <span class="cnt" id="char-cnt">0 символів</span>
    </div>
    <textarea id="editor" placeholder="# Вставте ваш текст тут...&#10;&#10;Підтримується Markdown: заголовки, списки, таблиці, код, цитати, зображення, посилання."></textarea>
  </div>
  <div class="bbar">
    <button class="btn-go" onclick="openReader()">Читати →</button>
    <div class="bbar-h">
      <span class="chip"><kbd>Ctrl</kbd>+<kbd>Enter</kbd></span>
      <span class="chip">Клік на текст = читати звідси</span>
      <span class="chip">22 мови TTS</span>
    </div>
  </div>
  <div class="smp">
    <div class="smp-l">Приклади</div>
    <div class="smp-g">
      <button class="smp-b" onclick="loadSample('markdown')">Markdown</button>
      <button class="smp-b" onclick="loadSample('python')">Python код</button>
      <button class="smp-b" onclick="loadSample('table')">Таблиця</button>
      <button class="smp-b" onclick="loadSample('article')">Стаття</button>
    </div>
  </div>
</div>

<div id="reading-screen">
  <div class="topbar">
    <button class="btn-back" onclick="closeReader()">← Назад</button>
    <div class="rm">
      <span class="lb" id="det-lang"></span>
      <span id="word-cnt"></span>
    </div>
  </div>
  <div class="art" id="article"></div>
</div>

<div class="tts-bar" id="tts-bar">
  <button class="pr" id="tts-btn" onclick="ttsToggle()">▶ Читати</button>
  <div class="tc"><span>Мова:</span><select id="tts-lang"></select></div>
  <div class="tc"><span>Голос:</span><select id="tts-voice"></select></div>
  <div class="tc">
    <span>Швидкість:</span>
    <select id="tts-speed">
      <option value="-30%">0.7x</option>
      <option value="-15%">0.85x</option>
      <option value="+0%" selected>1x</option>
      <option value="+15%">1.15x</option>
      <option value="+30%">1.3x</option>
      <option value="+50%">1.5x</option>
    </select>
  </div>
  <span class="tts-eng" id="tts-eng">edge-tts</span>
  <div class="tp"><div class="tpf" id="tpf"></div></div>
  <div class="ts" id="tts-st">0%</div>
  <button onclick="ttsStop()">⏹</button>
</div>

<audio id="tts-audio" preload="auto"></audio>

<script>
const LANGS=[
  {c:'uk-UA',n:'Українська',f:'🇺🇦',d:/[а-яіїєґ]/i},

  {c:'pt-BR',n:'Português (BR)',f:'🇧🇷',d:/[ãõêô]/i},

  {c:'zh-CN',n:'中文',f:'🇨🇳',d:/[\u4e00-\u9fff]/},

  {c:'tr-TR',n:'Türkçe',f:'🇹🇷',d:/[çğıöşü]/i},
  {c:'ar-SA',n:'العربية',f:'🇸🇦',d:/[\u0600-\u06ff]/},
  {c:'hi-IN',n:'हिन्दी',f:'🇮🇳',d:/[\u0900-\u097f]/},
  {c:'hu-HU',n:'Magyar',f:'🇭🇺',d:/[őű]/i},
  {c:'ro-RO',n:'Română',f:'🇷🇴',d:/[ăâîșț]/i},
  {c:'sv-SE',n:'Svenska',f:'🇸🇪',d:/[åäö]/i},
  {c:'nb-NO',n:'Norsk',f:'🇳🇴',d:/[æøå]/i},
  {c:'fi-FI',n:'Suomi',f:'🇫🇮',d:/[äö]/i},

function detectLang(t){for(const l of LANGS)if(l.d&&l.d.test(t))return l;return LANGS.find(l=>l.c==='en-US')}

function cleanTTS(text){
  return text
    .replace(/```[\s\S]*?```/g,' ')
    .replace(/`[^`]+`/g,' ')
    .replace(/^#{1,6}\s+/gm,'')
    .replace(/\*\*(.+?)\*\*/g,'$1')
    .replace(/\*(.+?)\*/g,'$1')
    .replace(/__(.+?)__/g,'$1')
    .replace(/_(.+?)_/g,'$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/!\[([^\]]*)\]\([^)]+\)/g,' ')
    .replace(/^>\s+/gm,'')
    .replace(/^\|/gm,'')
    .replace(/\|$/gm,'')
    .replace(/\|/g,',')
    .replace(/^[-*_]{3,}$/gm,' ')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

function buildChunks(){
  ttsChunks=[];
  const els=artEl.querySelectorAll('p,h1,h2,h3,h4,li');
  els.forEach((el,i)=>{
    const raw=el.textContent.trim();
    if(!raw)return;
    const cleaned=cleanTTS(raw);
    if(!cleaned||cleaned.length<3)return;
    el.setAttribute('data-p',ttsChunks.length);
    ttsChunks.push(cleaned);
    el.addEventListener('click',()=>{
      if(playing&&idx===parseInt(el.getAttribute('data-p'))){ttsStop();return}
      startFrom(parseInt(el.getAttribute('data-p')));
    });
  });
}

function highlightChunk(i){
  artEl.querySelectorAll('[data-p]').forEach(e=>e.classList.remove('reading'));
  if(i<0)return;
  const el=artEl.querySelector('[data-p="'+i+'"]');
  if(el){el.classList.add('reading');el.scrollIntoView({behavior:'smooth',block:'center'})}
}

function openReader(){
  const t=editor.value.trim();if(!t)return;
  artEl.innerHTML=marked.parse(t);
  artEl.querySelectorAll('pre code').forEach(b=>hljs.highlightElement(b));
  buildChunks();
  document.getElementById('input-screen').style.display='none';
  document.getElementById('reading-screen').style.display='block';
  document.getElementById('tts-bar').classList.add('on');
  document.body.classList.add('reader-on');
  window.scrollTo(0,0);
  const l=detectLang(t);
  document.getElementById('det-lang').textContent=l.f+' '+l.n;
  document.getElementById('tts-lang').value=l.c;
  populateVoices(l.c);
  document.getElementById('word-cnt').textContent=t.split(/\s+/).filter(w=>w).length+' слів';
  localStorage.setItem('chitala_text',t);
}

function closeReader(){
  ttsStop();
  document.getElementById('reading-screen').style.display='none';
  document.getElementById('input-screen').style.display='block';
  document.getElementById('tts-bar').classList.remove('on');
  document.body.classList.remove('reader-on');
  window.scrollTo(0,0);
}

function populateVoices(locale){
  const saved=localStorage.getItem('chitala_voice');
  ttsVoice.innerHTML='';
  let voices=allVoices[locale];
  if(!voices||voices.length===0){
    const o=document.createElement('option');
    o.value='';o.textContent='— завантаження...';ttsVoice.appendChild(o);
    return;
  }
  voices.forEach(v=>{
    const o=document.createElement('option');
    o.value=v.name;
    const g=GENDER_ICONS[v.gender]||'';
    const gn=GENDER_NAMES[v.gender]||'';
    const short=v.name.split('-').slice(2).join('-').replace('Neural','').replace('Multilingual','');
    o.textContent=g+' '+short+' ('+gn+')';
    ttsVoice.appendChild(o);
  });
  if(saved&&voices.find(v=>v.name===saved)){ttsVoice.value=saved}
}

function saveVoicePref(){if(ttsVoice.value)localStorage.setItem('chitala_voice',ttsVoice.value)}
ttsVoice.addEventListener('change',saveVoicePref);

let mode='edge',playing=false,idx=0,blobUrl=null,curVoice='',curRate='';

async function detectBackend(){
  try{
    const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'test',voice:'uk-UA-PolinaNeural',rate:'+0%'})});
    if(r.ok||r.status===500){mode='edge';document.getElementById('tts-eng').textContent='edge-tts';document.getElementById('tts-eng').classList.remove('fb');return}
  }catch{}
  mode='browser';document.getElementById('tts-eng').textContent='browser';document.getElementById('tts-eng').classList.add('fb');
}

async function startFrom(i){
  await detectBackend();
  ttsStop();
  idx=i;
  curVoice=ttsVoice.value||'uk-UA-PolinaNeural';
  curRate=ttsSpeed.value;
  if(mode==='edge')playEdge();else readBr();
}

async function edgeSpeak(text,voice,rate){
  const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voice,rate})});
  if(!r.ok)throw new Error('TTS failed');
  return URL.createObjectURL(await r.blob());
}

async function playEdge(){
  if(idx>=ttsChunks.length){ttsStop();document.getElementById('tts-st').textContent='✓';document.getElementById('tpf').style.width='100%';return}
  try{
    highlightChunk(idx);
    document.getElementById('tts-btn').textContent='⏸ Пауза';
    document.getElementById('tts-st').textContent=(idx+1)+'/'+ttsChunks.length;
    const url=await edgeSpeak(ttsChunks[idx],curVoice,curRate);
    if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=url;
    ttsAudioEl.src=url;
    ttsAudioEl.onended=()=>{idx++;updateP();playEdge()};
    ttsAudioEl.onerror=()=>{idx++;updateP();playEdge()};
    await ttsAudioEl.play();playing=true;
  }catch(e){
    console.error(e);mode='browser';
    document.getElementById('tts-eng').textContent='browser';
    document.getElementById('tts-eng').classList.add('fb');
    readBr();
  }
}

function readBr(){
  speechSynthesis.cancel();
  if(idx>=ttsChunks.length){ttsStop();document.getElementById('tts-st').textContent='✓';document.getElementById('tpf').style.width='100%';return}
  highlightChunk(idx);
  document.getElementById('tts-btn').textContent='⏸ Пауза';
  const u=new SpeechSynthesisUtterance(ttsChunks[idx]);
  u.lang=ttsLang.value;u.rate=1;u.pitch=1;
  const vs=speechSynthesis.getVoices();
  const m=vs.find(v=>v.lang.startsWith(ttsLang.value));
  if(m)u.voice=m;
  u.onend=()=>{idx++;updateP();readBr()};
  u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted'){idx++;updateP();readBr()}};
  speechSynthesis.speak(u);playing=true;
  document.getElementById('tts-st').textContent='🔊';
}

function ttsToggle(){
  if(playing){
    if(mode==='edge'){
      if(!ttsAudioEl.paused){ttsAudioEl.pause();document.getElementById('tts-btn').textContent='▶ Далі';document.getElementById('tts-st').textContent='⏸'}
      else{ttsAudioEl.play();document.getElementById('tts-btn').textContent='⏸ Пауза'}
    }else{
      if(speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();document.getElementById('tts-btn').textContent='▶ Далі'}
      else{speechSynthesis.resume();document.getElementById('tts-btn').textContent='⏸ Пауза'}
    }
  }else{startFrom(0)}
}

function ttsStop(){
  speechSynthesis.cancel();
  ttsAudioEl.pause();ttsAudioEl.src='';
  if(blobUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}
  playing=false;idx=0;
  highlightChunk(-1);
  document.getElementById('tts-btn').textContent='▶ Читати';
  document.getElementById('tts-st').textContent='0%';
  document.getElementById('tpf').style.width='0%';
}

function updateP(){
  const p=ttsChunks.length?Math.round(idx/ttsChunks.length*100):0;
  document.getElementById('tpf').style.width=p+'%';
  document.getElementById('tts-st').textContent=p+'%';
}

speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
